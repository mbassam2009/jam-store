name: Copy product photos

# Downloads every product photo listed in js/data.js from the Salla CDN
# into img/ so the site no longer depends on the Salla store staying open.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/photos.yml']

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: |
          mkdir -p img
          grep -oE "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}" js/data.js | sort -u > /tmp/ids.txt
          echo "photos listed: $(wc -l < /tmp/ids.txt)"
          while read -r id; do
            curl -fsSL --retry 3 -o "img/$id.webp" "https://cdn.files.salla.network/other/50764866/$id-original.webp" || { echo "missing: $id"; rm -f "img/$id.webp"; }
          done < /tmp/ids.txt
          echo "photos saved: $(ls img | wc -l)"; du -sh img
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "Add product photos"
          git push
